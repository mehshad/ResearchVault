sonar.projectKey=researchvault
sonar.projectName=ResearchVault (IRIS)
sonar.projectVersion=1.0

# Source directories
sonar.sources=server,client/src,shared
sonar.tests=server

# Test file patterns
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx

# Exclusions — generated code, migrations, node_modules
sonar.exclusions=\
  **/node_modules/**,\
  **/dist/**,\
  **/migrations/**,\
  **/*.test.ts,\
  **/demo_seed_data.sql

# TypeScript
sonar.typescript.lcov.reportPaths=coverage/lcov.info

# Encoding
sonar.sourceEncoding=UTF-8

# Coverage report (generated by CI before sonar scan)
sonar.javascript.lcov.reportPaths=coverage/lcov.info
