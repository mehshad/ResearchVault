name: Security

on:
  push:
    branches: [main]
  # Every pull request, whatever it targets.
  pull_request:
  schedule:
    # Nightly scan at 02:00 UTC
    - cron: "0 2 * * *"

jobs:
  dependency-audit:
    name: Dependency CVE Scan (npm audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: NODE_ENV=development npm ci --legacy-peer-deps

      - name: npm audit — fail on high/critical
        run: npm audit --audit-level=high --omit=dev

  container-scan:
    name: Container Image Scan (Trivy)
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t researchvault:${{ github.sha }} .

      # Run with exit-code 0 so the SARIF file is always written.
      # A separate step below enforces the HIGH/CRITICAL gate.
      - name: Run Trivy vulnerability scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: researchvault:${{ github.sha }}
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL
          exit-code: "0"
          ignore-unfixed: true

      - name: Upload Trivy results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif

      # Now enforce the gate: re-run in table mode and fail if issues found
      - name: Fail on HIGH/CRITICAL vulnerabilities
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: researchvault:${{ github.sha }}
          format: table
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true

  sast:
    name: Static Analysis (Semgrep)
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: Run Semgrep
        # Run via CLI so --output always writes the SARIF file, even with 0 findings.
        # Exit code 1 means findings were found (not a crash), so || true lets the
        # next step upload results regardless.
        run: |
          python3 -m pip install semgrep --quiet
          semgrep scan \
            --config p/nodejs \
            --config p/react \
            --config p/owasp-top-ten \
            --config p/secrets \
            --sarif \
            --output semgrep.sarif \
            . || true
          # Guarantee the file exists even if semgrep exited unexpectedly
          [ -f semgrep.sarif ] || echo '{"version":"2.1.0","runs":[]}' > semgrep.sarif

      - name: Upload Semgrep results to GitHub Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: semgrep.sarif

      # The scan above never fails the job (|| true keeps the SARIF upload
      # alive), so until now this check could not go red. ERROR-severity
      # findings fail it here; warnings and notes stay in the Security tab.
      - name: Fail on ERROR-severity findings
        run: |
          python3 - <<'PY'
          import json, sys
          runs = json.load(open("semgrep.sarif")).get("runs", [])
          errors = [r for run in runs for r in run.get("results", []) if r.get("level") == "error"]
          for r in errors:
              loc = r.get("locations", [{}])[0].get("physicalLocation", {})
              print(f"{loc.get('artifactLocation', {}).get('uri')}:{loc.get('region', {}).get('startLine')}  {r.get('ruleId')}")
          print(f"{len(errors)} ERROR-severity finding(s)")
          sys.exit(1 if errors else 0)
          PY
