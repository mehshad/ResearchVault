name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: Typecheck · Unit Tests · Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: NODE_ENV=development npm ci --legacy-peer-deps

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Unit tests
        # DATABASE_URL satisfies the import-time check in db.ts.
        # Unit tests mock the DB; integration tests are excluded from this step.
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci_test
        run: node --import tsx --test $(find server -name '*.test.ts' ! -name '*.integration.test.ts')

      - name: Unit test coverage
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci_test
        run: |
          node --import tsx \
            --experimental-test-coverage \
            --test-reporter=spec \
            --test $(find server -name '*.test.ts' ! -name '*.integration.test.ts') \
          2>&1 | tee coverage-report.txt
          echo "## Test Coverage" >> $GITHUB_STEP_SUMMARY
          grep -A 9999 "^-" coverage-report.txt | head -60 >> $GITHUB_STEP_SUMMARY || true

      - name: Build
        run: NODE_ENV=development npm run build

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: NODE_ENV=development npm ci --legacy-peer-deps

      - name: Run migrations
        env:
          PGPASSWORD: ci
        run: |
          for f in $(ls migrations/*.sql | grep -v demo_seed_data | sort); do
            echo "Applying $f …"
            psql -h localhost -U ci -d ci_test -f "$f" || true
          done

      - name: Integration tests
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci_test
        run: |
          node --import tsx --test \
            $(find server -name '*.integration.test.ts')
