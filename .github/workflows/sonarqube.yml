name: SonarQube

on:
  schedule:
    # Nightly at 03:00 UTC
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  sonar:
    name: SonarQube Analysis
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # Shallow clones should be disabled for better SonarQube relevance
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: NODE_ENV=development npm ci --legacy-peer-deps

      # Both steps used to be wrapped in `|| true` and continue-on-error, so
      # a broken typecheck or a failing test still produced a green nightly
      # run with a coverage file from whatever survived. They fail now; the
      # typecheck passes and the unit tests need no database.
      - name: TypeScript check (for issue reporting)
        run: npx tsc --noEmit 2>&1 | tee tsc-output.txt

      - name: Run unit tests with coverage
        run: |
          node --import tsx \
               --experimental-test-coverage \
               --test-reporter=lcov \
               --test-reporter-destination=coverage/lcov.info \
               --test $(find server shared client/src -name '*.test.ts' ! -name '*.integration.test.ts')

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@master
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
