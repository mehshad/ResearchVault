name: SonarQube

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  sonar:
    name: SonarQube Analysis
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # Shallow clones should be disabled for better SonarQube relevance
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: NODE_ENV=development npm ci --legacy-peer-deps

      - name: TypeScript check (for issue reporting)
        run: npx tsc --noEmit 2>&1 | tee tsc-output.txt || true

      - name: Run unit tests with coverage
        # Node's built-in test runner with --experimental-test-coverage
        run: |
          node --experimental-strip-types \
               --experimental-test-coverage \
               --test-reporter=lcov \
               --test-reporter-destination=coverage/lcov.info \
               --test server/**/*.test.ts || true
        continue-on-error: true

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@master
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
